<!DOCTYPE html>
<html>
</head>
    <body>
        <div id="root"></div>
    </body>
    <script src="https://unpkg.com/react@17.0.2/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.7.2/prop-types.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">

        function Btn (props) {
            // console.log(props.title + " is rendered");
            // return ( <button onClick={props.clickAction}>{props.title}</button> );
            return ( <button style={{fontSize: props.fontSize}}>{props.text}</button> );
        }

        // React memo 기능을 사용하게되면 변경되지 않은것에는 특별히 렌더링이 이루어지지 않는다.
        // const MemoizedBtn = React.memo(Btn);

        Btn.propsTypes = {
            text: PropTypes.string.isRequired,
            fontSize: PropTypes.number
        }

        function Container (){
            const [value, setValue] = React.useState("Btn1");
            const changetitle = () => {
                setValue("Btn3");
            }

            // React memo 기능을 사용하게되면 변경되지 않은것에는 특별히 렌더링이 이루어지지 않는다.
            // return (
            //     <div>
            //         <MemoizedBtn title={value} clickAction={changetitle} />
            //         <MemoizedBtn title="Btn2"  />
            //     </div>  
            // )
            return (
                <div>
                    <Btn text={value} fontSize={16} />
                    <Btn text="Btn2" fontSize={1}  />
                </div>  
            )
        }
        
        ReactDOM.render(<Container/>, document.querySelector("#root"));

    </script>
</html>
